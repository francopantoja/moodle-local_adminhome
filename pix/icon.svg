<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>EasyHome</title>

  <!-- Fondo blanco con esquinas redondeadas -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#FFFFFF"/>

  <!-- Sol grande detrás de la casa, con borde amarillo intenso -->
  <circle cx="370" cy="160" r="90" fill="#FDC15A" stroke="#F5A300" stroke-width="16"/>

  <g stroke="#3A3F47" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">

    <!-- Cuerpo de la casa con hastial -->
    <path d="M120 280 L240 180 L360 280 V420 H120 Z" fill="#FFFFFF"/>

    <!-- Tejado: banda gruesa naranja con alero -->
    <path d="M66 268 L240 122 L414 268 L384 298 L240 178 L96 298 Z" fill="#F26B1D"/>

    <!-- Puerta grande en arco -->
    <path d="M196 420 V342 a44 44 0 0 1 88 0 V420" fill="#D6D9DE"/>

    <!-- Línea de suelo -->
    <line x1="72" y1="420" x2="440" y2="420" fill="none"/>
  </g>
</svg>
